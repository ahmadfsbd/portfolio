<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Monitoring alert grouping model</title>
  <desc id="desc">Events with the same project, bucket, principal, caller IP, and method are grouped into one incident. Different grouping keys create separate incidents.</desc>
  <defs>
    <linearGradient id="bg-alert-grouping" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#12343f"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow-alert-grouping" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow-alert-grouping" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#99f6e4"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg-alert-grouping)"/>

  <g font-family="Roboto, Arial, sans-serif">
    <text x="60" y="56" font-size="28" font-weight="700" fill="#f8fafc">Alert grouping keeps repeated access readable</text>
    <text x="60" y="86" font-size="16" fill="#cbd5e1">Repeated matches with the same grouping keys collect into one incident; different keys stay separate.</text>
  </g>

  <g filter="url(#shadow-alert-grouping)" font-family="Roboto, Arial, sans-serif">
    <rect x="64" y="128" width="330" height="54" rx="12" fill="#f8fafc"/>
    <rect x="64" y="196" width="330" height="54" rx="12" fill="#f8fafc"/>
    <rect x="64" y="264" width="330" height="54" rx="12" fill="#f8fafc"/>

    <rect x="780" y="138" width="330" height="72" rx="14" fill="#ecfeff"/>
    <rect x="780" y="244" width="330" height="72" rx="14" fill="#fff7ed"/>
  </g>

  <g font-family="Roboto Mono, monospace" font-size="15" fill="#0f172a">
    <text x="86" y="162">project=A bucket=X user=U ip=1 method=get</text>
    <text x="86" y="230">project=A bucket=X user=U ip=1 method=get</text>
    <text x="86" y="298">project=A bucket=X user=U ip=2 method=get</text>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="945" y="167" font-size="23" font-weight="700" fill="#0f172a">One Incident</text>
    <text x="945" y="193" font-size="15" fill="#475569">same project, bucket, user, IP, method</text>

    <text x="945" y="273" font-size="23" font-weight="700" fill="#0f172a">Separate Incident</text>
    <text x="945" y="299" font-size="15" fill="#475569">caller IP changed</text>
  </g>

  <g fill="none" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-alert-grouping)">
    <path d="M 420 155 C 530 155 610 155 750 172"/>
    <path d="M 420 223 C 530 223 610 200 750 184"/>
    <path d="M 420 291 C 540 291 620 289 750 280"/>
  </g>

  <g font-family="Roboto, Arial, sans-serif" font-size="14" text-anchor="middle">
    <rect x="472" y="131" width="168" height="30" rx="15" fill="#0f766e"/>
    <text x="556" y="151" fill="#f0fdfa">same keys</text>
    <rect x="492" y="262" width="172" height="30" rx="15" fill="#c2410c"/>
    <text x="578" y="282" fill="#fff7ed">changed key</text>
  </g>
</svg>
