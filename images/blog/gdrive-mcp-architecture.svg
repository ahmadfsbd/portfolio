<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Google Drive MCP architecture</title>
  <desc id="desc">Codex CLI starts a local MCP server, and the MCP server calls the Google Drive API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="75" y="110" width="270" height="140" rx="14" fill="#f8fafc"/>
    <rect x="465" y="92" width="270" height="176" rx="14" fill="#f8fafc"/>
    <rect x="855" y="110" width="270" height="140" rx="14" fill="#f8fafc"/>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="210" y="162" font-size="30" font-weight="700" fill="#0f172a">Codex CLI</text>
    <text x="210" y="198" font-size="18" fill="#475569">runs locally</text>

    <text x="600" y="145" font-size="28" font-weight="700" fill="#0f172a">Local MCP Server</text>
    <text x="600" y="181" font-size="18" fill="#475569">standard MCP interface</text>
    <text x="600" y="210" font-size="18" fill="#475569">Google Drive adapter</text>

    <text x="990" y="162" font-size="30" font-weight="700" fill="#0f172a">Drive API</text>
    <text x="990" y="198" font-size="18" fill="#475569">Google service</text>
  </g>

  <g fill="none" stroke="#99f6e4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 180 H440"/>
    <path d="M420 158 L445 180 L420 202"/>
    <path d="M760 180 H830"/>
    <path d="M810 158 L835 180 L810 202"/>
  </g>

  <g font-family="Roboto Mono, monospace" text-anchor="middle" font-size="16" fill="#ccfbf1">
    <text x="405" y="138">starts server</text>
    <text x="795" y="138">API calls</text>
    <text x="405" y="232">tool results</text>
    <text x="795" y="232">API response</text>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="9 9" stroke-linecap="round">
    <path d="M440 220 H370"/>
    <path d="M830 220 H760"/>
  </g>

  <g fill="#e0f2fe" opacity="0.22">
    <circle cx="90" cy="60" r="10"/>
    <circle cx="1120" cy="296" r="14"/>
    <circle cx="610" cy="48" r="8"/>
  </g>
</svg>
