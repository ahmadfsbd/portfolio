<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Route broadly and alert narrowly</title>
  <desc id="desc">Successful sensitive bucket access is routed to a central log bucket first. The outside-network check is applied later by the log-based metric.</desc>
  <defs>
    <linearGradient id="bg-route-alert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="0.58" stop-color="#103846"/>
      <stop offset="1" stop-color="#18202d"/>
    </linearGradient>
    <filter id="shadow-route-alert" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.26"/>
    </filter>
    <marker id="arrow-route-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#99f6e4"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg-route-alert)"/>
  <g font-family="Roboto, Arial, sans-serif">
    <text x="60" y="58" font-size="28" font-weight="700" fill="#f8fafc">Route broadly. Alert narrowly.</text>
    <text x="60" y="88" font-size="16" fill="#cbd5e1">Keep investigation logs central, then apply the risky network condition at the metric layer.</text>
  </g>

  <g filter="url(#shadow-route-alert)">
    <rect x="60" y="128" width="285" height="130" rx="14" fill="#f8fafc"/>
    <rect x="458" y="128" width="285" height="130" rx="14" fill="#f8fafc"/>
    <rect x="856" y="128" width="285" height="130" rx="14" fill="#f8fafc"/>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="202.5" y="174" font-size="24" font-weight="700" fill="#0f172a">Project Sink</text>
    <text x="202.5" y="205" font-size="16" fill="#475569">successful scoped reads</text>
    <text x="202.5" y="228" font-size="16" fill="#475569">and deletes only</text>

    <text x="600.5" y="174" font-size="24" font-weight="700" fill="#0f172a">Central Log Bucket</text>
    <text x="600.5" y="205" font-size="16" fill="#475569">complete investigation copy</text>
    <text x="600.5" y="228" font-size="16" fill="#475569">for sensitive buckets</text>

    <text x="998.5" y="174" font-size="24" font-weight="700" fill="#0f172a">Metric + Alert</text>
    <text x="998.5" y="205" font-size="16" fill="#475569">outside approved CIDRs</text>
    <text x="998.5" y="228" font-size="16" fill="#475569">becomes a critical signal</text>
  </g>

  <g fill="none" stroke="#99f6e4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-route-alert)">
    <path d="M 370 193 H 430"/>
    <path d="M 768 193 H 828"/>
  </g>

  <g font-family="Roboto Mono, monospace" font-size="14" text-anchor="middle">
    <text x="400" y="166" fill="#ccfbf1">route</text>
    <text x="798" y="166" fill="#ccfbf1">evaluate</text>
  </g>

  <g>
    <circle cx="1054" cy="95" r="21" fill="#ef4444" opacity="0.92"/>
    <circle cx="1054" cy="95" r="42" fill="none" stroke="#f97316" stroke-width="3" opacity="0.48"/>
    <circle cx="1054" cy="95" r="63" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.28"/>
  </g>
</svg>
